name = "ocean-ai-llm5"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"


[vars]
CF_ACCOUNT_ID = "e809b1129ec4b6f69520858ac79b2095"
CF_GATEWAY_ID = "llm5"
ADMIN_PASSWORD = "llm5admin"
# AI GatewayでToken認証を有効にしている場合は設定
# CF_AIG_TOKEN = "your-api-gateway-token"
# エンドポイントURLを丸ごと指定したい場合は設定
# CF_AI_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/e809b1129ec4b6f69520858ac79b2095/llm5/compat/chat/completions"

# Cloudflare Workers AI バインディング (内部バインディングのためAPIトークン不要・Gateway連携対応)
[ai]
binding = "AI"

# Cloudflare D1 データベースバインディング
[[d1_databases]]
binding = "DB"
database_name = "llm5-db-d1"
database_id = "9cdaa476-7091-4e37-b67f-f3c2af7cfb55"

# Cloudflare R2 バケットバインディング
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "llm-db-r2"

