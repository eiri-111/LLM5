name = "ocean-ai-llm5"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"


[vars]
CF_ACCOUNT_ID = "e809b1129ec4b6f69520858ac79b2095"
CF_GATEWAY_ID = "llm5"
# AI GatewayでToken認証を有効にしている場合は設定
# CF_AIG_TOKEN = "your-api-gateway-token"
# エンドポイントURLを丸ごと指定したい場合は設定
# CF_AI_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/e809b1129ec4b6f69520858ac79b2095/llm5/compat/chat/completions"

# Cloudflare D1 データベースバインディング
# wrangler d1 create llm5-db で作成した database_id を設定してください
[[d1_databases]]
binding = "DB"
database_name = "llm5-db"
database_id = "your-d1-database-id"

# Cloudflare R2 バケットバインディング (任意)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "llm5-sessions"
